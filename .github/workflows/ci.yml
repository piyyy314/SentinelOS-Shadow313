name: Shadow313 CI

on:
  push:
    branches:
      - master
      - devops-foundation
  pull_request:

jobs:
  validate:
    name: Validate Shadow313
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validation
        run: bash ./scripts/validate.sh
